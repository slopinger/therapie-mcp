[project]
name = "therapie-mcp"
version = "0.3.0"
description = "MCP server for therapie.de search, profile comparison, private shortlists and email drafting"
readme = "README.md"
authors = [{ name = "slop", email = "slopmoder@tutamail.com" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1", "beautifulsoup4>=4.13", "mcp>=2.3"]

[project.scripts]
therapie-mcp = "therapie_mcp.server:main"

[project.urls]
Homepage = "https://github.com/slopinger/therapie-mcp"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the real therapie.de website"]
addopts = "-m 'not live'"
